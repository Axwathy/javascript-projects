<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lottery Draw</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="lottery.css" />
</head>
<body>

  <div class="card">
    <h2>Lottery Draw</h2>

    <p class="ticket-label">All Ticket Numbers:</p>

    <!-- Ticket badges are rendered here by JavaScript -->
    <div class="ticket-list" id="ticket-list"></div>

    <!-- Draw Winner button -->
    <button onclick="drawWinner()">Draw Winner</button>

    <!-- Requirement 2: Winner shown on page in RED colour -->
    <div id="winner-display"></div>
  </div>


  <div class="modal fade" id="winnerModal" tabindex="-1" aria-labelledby="winnerModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title" id="winnerModalLabel">We have a winner!</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <p class="text-center mb-1">The winning ticket number is:</p>
          <div id="modal-winner-number"></div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>

      </div>
    </div>
  </div>


  <!-- Bootstrap JS (needed for modal to work) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Link to external JS file -->
  <script src="lottery.js"></script>

</body>
</html>
